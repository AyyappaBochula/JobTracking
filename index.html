<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>Hill 2 Job Tracker</title>

<style>
/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#475569;
    --border:#cbd5e1;

    --primary:#0f172a;
    --primary-text:#ffffff;

    --green:#15803d;
    --green-bg:#dcfce7;

    --blue:#075985;
    --blue-bg:#e0f2fe;

    --orange:#9a3412;
    --orange-bg:#ffedd5;

    --yellow:#854d0e;
    --yellow-bg:#fef9c3;

    --red:#b91c1c;
    --red-bg:#fee2e2;
}

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --muted:#cbd5e1;
    --border:#334155;

    --primary:#f8fafc;
    --primary-text:#0f172a;

    --green:#4ade80;
    --green-bg:#052e16;

    --blue:#38bdf8;
    --blue-bg:#082f49;

    --orange:#fb923c;
    --orange-bg:#431407;

    --yellow:#fde047;
    --yellow-bg:#422006;

    --red:#f87171;
    --red-bg:#450a0a;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    padding-bottom:90px;

    transition:
        background .2s,
        color .2s;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    background:#0f172a;
    color:#ffffff;

    padding:
        16px
        max(16px,env(safe-area-inset-right))
        16px
        max(16px,env(safe-area-inset-left));

    position:sticky;
    top:0;

    z-index:100;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header h1{
    font-size:21px;
    line-height:1.2;
}

.header p{
    font-size:12px;
    margin-top:5px;
    color:#cbd5e1;
}

.header-actions{
    display:flex;
    gap:7px;
}

.header-btn{
    border:2px solid #64748b;
    background:#1e293b;
    color:#ffffff;

    width:42px;
    height:42px;

    border-radius:12px;

    font-size:19px;

    cursor:pointer;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:850px;

    margin:auto;

    padding:14px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:12px;
}

.stat{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:11px 5px;

    text-align:center;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);
}

.stat-icon{
    font-size:18px;
}

.stat-number{
    font-size:21px;
    font-weight:800;

    margin-top:3px;
}

.stat-label{
    color:var(--muted);

    font-size:10px;

    margin-top:2px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    display:flex;
    gap:7px;

    margin-bottom:10px;
}

.search-input{
    flex:1;

    min-width:0;

    padding:14px;

    background:var(--card);

    color:var(--text);

    border:2px solid var(--border);

    border-radius:12px;

    font-size:15px;

    outline:none;
}

.search-input:focus{
    border-color:#2563eb;
}

.clear-search{
    width:48px;

    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    border-radius:12px;

    font-size:18px;

    cursor:pointer;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:3px;

    margin-bottom:12px;
}

.filter{
    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    padding:9px 13px;

    border-radius:22px;

    white-space:nowrap;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}

.filter.active{
    background:var(--primary);
    color:var(--primary-text);
    border-color:var(--primary);
}

/* =========================================================
   ADD COMPANY
========================================================= */

.add-company{
    width:100%;

    border:none;

    background:#2563eb;

    color:#ffffff;

    padding:14px;

    border-radius:12px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    margin-bottom:13px;

    box-shadow:
        0 3px 8px rgba(37,99,235,.25);
}

.add-company:active{
    transform:scale(.98);
}

/* =========================================================
   COMPANY CARD
========================================================= */

.company-card{
    background:var(--card);

    border:2px solid var(--border);

    border-left:7px solid #64748b;

    border-radius:15px;

    padding:14px;

    margin-bottom:12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.06);
}

.company-card.visited{
    border-left-color:var(--green);
}

.company-card.hiring{
    border-left-color:#2563eb;
}

.company-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:10px;
}

.company-number{
    color:var(--muted);

    font-size:11px;

    font-weight:800;

    margin-bottom:3px;
}

.company-name{
    font-size:18px;

    font-weight:900;

    line-height:1.25;
}

.company-location{
    color:var(--muted);

    font-size:12px;

    margin-top:5px;

    line-height:1.4;
}

/* =========================================================
   STATUS
========================================================= */

.badges{
    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-top:9px;
}

.badge{
    display:inline-block;

    padding:5px 8px;

    border-radius:20px;

    font-size:10px;

    font-weight:900;
}

.badge-hiring{
    background:var(--green-bg);
    color:var(--green);
}

.badge-interview{
    background:var(--blue-bg);
    color:var(--blue);
}

.badge-future{
    background:var(--yellow-bg);
    color:var(--yellow);
}

.badge-none{
    background:var(--red-bg);
    color:var(--red);
}

.badge-unknown{
    background:#e2e8f0;
    color:#334155;
}

body.dark .badge-unknown{
    background:#334155;
    color:#f8fafc;
}

.badge-visited{
    background:var(--green-bg);
    color:var(--green);
}

.badge-drive{
    background:var(--blue-bg);
    color:var(--blue);
}

/* =========================================================
   ROLE
========================================================= */

.role{
    margin-top:9px;

    padding:9px;

    background:var(--bg);

    border-radius:9px;

    font-size:12px;

    font-weight:700;
}

/* =========================================================
   QUICK INFO
========================================================= */

.quick-info{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:9px;
}

.info-chip{
    background:var(--bg);

    border:1px solid var(--border);

    padding:6px 8px;

    border-radius:8px;

    font-size:11px;

    color:var(--muted);

    font-weight:700;
}

/* =========================================================
   DRIVE BOX
========================================================= */

.drive-box{
    background:var(--blue-bg);

    border:2px solid var(--blue);

    color:var(--text);

    border-radius:11px;

    padding:10px;

    margin-top:10px;
}

.drive-title{
    color:var(--blue);

    font-weight:900;

    font-size:12px;
}

.drive-date{
    font-size:15px;

    font-weight:900;

    margin-top:4px;
}

.drive-details{
    font-size:11px;

    margin-top:4px;

    line-height:1.5;
}

/* =========================================================
   NOTES
========================================================= */

.note-box{
    background:var(--yellow-bg);

    color:var(--text);

    border-radius:10px;

    padding:10px;

    margin-top:10px;

    font-size:11px;

    line-height:1.5;
}

.note-title{
    font-weight:900;

    color:var(--yellow);

    margin-bottom:3px;
}

/* =========================================================
   QUICK BUTTONS
========================================================= */

.quick-actions{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:12px;
}

.quick-btn{
    min-height:42px;

    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    border-radius:9px;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    text-decoration:none;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;
}

.quick-btn:active{
    transform:scale(.97);
}

.btn-call{
    background:var(--green-bg);
    color:var(--green);
    border-color:var(--green);
}

.btn-map{
    background:var(--yellow-bg);
    color:var(--yellow);
    border-color:var(--yellow);
}

.btn-linkedin{
    background:var(--blue-bg);
    color:var(--blue);
    border-color:var(--blue);
}

.btn-action{
    background:var(--bg);
}

/* =========================================================
   VISITED
========================================================= */

.visit-btn{
    width:100%;

    margin-top:8px;

    min-height:44px;

    border:2px solid var(--primary);

    background:var(--primary);

    color:var(--primary-text);

    border-radius:10px;

    font-size:13px;

    font-weight:900;

    cursor:pointer;
}

.company-card.visited .visit-btn{
    background:var(--green);

    border-color:var(--green);

    color:white;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    background:rgba(2,6,23,.75);

    padding:12px;

    overflow-y:auto;
}

.modal.show{
    display:block;
}

.modal-box{
    width:100%;

    max-width:550px;

    margin:10px auto;

    background:var(--card);

    color:var(--text);

    border-radius:18px;

    padding:18px;

    border:2px solid var(--border);
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

.modal-title{
    font-size:20px;

    font-weight:900;
}

.close-btn{
    width:38px;
    height:38px;

    border:none;

    background:var(--bg);

    color:var(--text);

    border-radius:50%;

    font-size:22px;

    cursor:pointer;
}

/* =========================================================
   FORM
========================================================= */

.form-group{
    margin-bottom:12px;
}

.form-label{
    display:block;

    font-size:12px;

    font-weight:900;

    color:var(--muted);

    margin-bottom:5px;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;

    padding:12px;

    border:2px solid var(--border);

    border-radius:10px;

    background:var(--card);

    color:var(--text);

    font-size:14px;

    outline:none;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    border-color:#2563eb;
}

.form-textarea{
    min-height:90px;

    resize:vertical;
}

.save-btn{
    width:100%;

    padding:13px;

    border:none;

    background:#2563eb;

    color:white;

    border-radius:10px;

    font-size:14px;

    font-weight:900;

    cursor:pointer;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    background:var(--card);

    border:2px dashed var(--border);

    border-radius:15px;

    padding:35px 20px;

    text-align:center;

    color:var(--muted);
}

/* =========================================================
   BACKUP
========================================================= */

.bottom-tools{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:16px;
}

.tool-btn{
    padding:12px;

    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    border-radius:10px;

    font-size:11px;

    font-weight:900;

    cursor:pointer;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .container{
        padding:20px;
    }

    .company-list{
        display:grid;

        grid-template-columns:
            1fr 1fr;

        gap:12px;
    }

    .company-card{
        margin-bottom:0;
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .dashboard{
        grid-template-columns:
            repeat(2,1fr);
    }

    .quick-actions{
        grid-template-columns:
            repeat(2,1fr);
    }

    .company-name{
        font-size:17px;
    }

}
</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================== -->

<header class="header">

    <div class="header-row">

        <div>
            <h1>🚀 Hill 2 Jobs</h1>
            <p>Visakhapatnam • Walk-in Tracker</p>
        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                onclick="toggleDarkMode()"
                id="themeButton"
                title="Change theme">
                ☀️
            </button>

        </div>

    </div>

</header>


<!-- =======================================================
     MAIN
======================================================== -->

<main class="container">


<!-- DASHBOARD -->

<section class="dashboard">

    <div class="stat">
        <div class="stat-icon">🏢</div>
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">Companies</div>
    </div>

    <div class="stat">
        <div class="stat-icon">✅</div>
        <div class="stat-number" id="visitedCount">0</div>
        <div class="stat-label">Visited</div>
    </div>

    <div class="stat">
        <div class="stat-icon">👤</div>
        <div class="stat-number" id="contactCount">0</div>
        <div class="stat-label">Contacts</div>
    </div>

    <div class="stat">
        <div class="stat-icon">📅</div>
        <div class="stat-number" id="driveCount">0</div>
        <div class="stat-label">Drives</div>
    </div>

</section>


<!-- SEARCH -->

<div class="search-box">

    <input
        class="search-input"
        id="searchInput"
        type="search"
        placeholder="🔎 Search company, HR, phone..."
        oninput="render()"
    >

    <button
        class="clear-search"
        onclick="clearSearch()">
        ×
    </button>

</div>


<!-- FILTERS -->

<div class="filters">

    <button
        class="filter active"
        onclick="setFilter('all',this)">
        All
    </button>

    <button
        class="filter"
        onclick="setFilter('remaining',this)">
        Not Visited
    </button>

    <button
        class="filter"
        onclick="setFilter('visited',this)">
        Visited
    </button>

    <button
        class="filter"
        onclick="setFilter('drives',this)">
        📅 Drives
    </button>

</div>


<!-- ADD COMPANY -->

<button
    class="add-company"
    onclick="openCompanyModal()">

    ➕ Add New Company

</button>


<!-- COMPANY LIST -->

<div
    id="companyList"
    class="company-list">
</div>


<!-- BACKUP -->

<div class="bottom-tools">

    <button
        class="tool-btn"
        onclick="exportData()">
        📤 Backup
    </button>

    <button
        class="tool-btn"
        onclick="document.getElementById('importFile').click()">
        📥 Restore
    </button>

</div>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none"
    onchange="importData(event)"
>

</main>


<!-- =======================================================
     COMPANY MODAL
======================================================== -->

<div
    class="modal"
    id="companyModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                <span id="companyModalTitle">
                    Add Company
                </span>
            </div>

            <button
                class="close-btn"
                onclick="closeModal('companyModal')">
                ×
            </button>

        </div>


        <form id="companyForm">

            <input
                type="hidden"
                id="companyId">


            <div class="form-group">

                <label class="form-label">
                    Company Name *
                </label>

                <input
                    class="form-input"
                    id="companyName"
                    required
                    placeholder="Example: MOURI Tech">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Location / Plot
                </label>

                <input
                    class="form-input"
                    id="companyLocation"
                    placeholder="Example: Plot D1, Hill 2">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Job Role
                </label>

                <input
                    class="form-input"
                    id="companyRole"
                    placeholder="Python / React / Full Stack">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Opening Status
                </label>

                <select
                    class="form-select"
                    id="companyStatus">

                    <option value="Unknown">
                        Unknown
                    </option>

                    <option value="Hiring">
                        🟢 Hiring
                    </option>

                    <option value="Interview">
                        🔵 Interview
                    </option>

                    <option value="Future Opening">
                        🟡 Future Opening
                    </option>

                    <option value="No Opening">
                        🔴 No Opening
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label class="form-label">
                    LinkedIn
                </label>

                <input
                    class="form-input"
                    id="companyLinkedin"
                    placeholder="https://linkedin.com/company/...">

            </div>


            <button
                class="save-btn"
                type="submit">

                💾 Save Company

            </button>

        </form>

    </div>

</div>


<!-- =======================================================
     CONTACT MODAL
======================================================== -->

<div
    class="modal"
    id="contactModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                👤 Add Contact
            </div>

            <button
                class="close-btn"
                onclick="closeModal('contactModal')">
                ×
            </button>

        </div>


        <form id="contactForm">

            <input
                type="hidden"
                id="contactCompanyId">


            <div class="form-group">

                <label class="form-label">
                    Person Name
                </label>

                <input
                    class="form-input"
                    id="contactPerson"
                    placeholder="HR / Recruiter name">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Mobile Number
                </label>

                <input
                    class="form-input"
                    id="contactPhone"
                    type="tel"
                    placeholder="9876543210">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Second Number
                </label>

                <input
                    class="form-input"
                    id="contactPhone2"
                    type="tel"
                    placeholder="Optional">

            </div>


            <button
                class="save-btn"
                type="submit">

                💾 Save Contact

            </button>

        </form>

    </div>

</div>


<!-- =======================================================
     DRIVE MODAL
======================================================== -->

<div
    class="modal"
    id="driveModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                📅 Add Walk-in / Drive
            </div>

            <button
                class="close-btn"
                onclick="closeModal('driveModal')">
                ×
            </button>

        </div>


        <form id="driveForm">

            <input
                type="hidden"
                id="driveCompanyId">


            <div class="form-group">

                <label class="form-label">
                    Drive Date *
                </label>

                <input
                    class="form-input"
                    id="driveDate"
                    type="date"
                    required>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Time
                </label>

                <input
                    class="form-input"
                    id="driveTime"
                    type="time">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Role
                </label>

                <input
                    class="form-input"
                    id="driveRole"
                    placeholder="Python Developer">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Details
                </label>

                <textarea
                    class="form-textarea"
                    id="driveDetails"
                    placeholder="Reporting time, documents required, venue, rounds...">
                </textarea>

            </div>


            <button
                class="save-btn"
                type="submit">

                💾 Save Drive

            </button>

        </form>

    </div>

</div>


<!-- =======================================================
     NOTE MODAL
======================================================== -->

<div
    class="modal"
    id="noteModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                📝 Add Note
            </div>

            <button
                class="close-btn"
                onclick="closeModal('noteModal')">
                ×
            </button>

        </div>


        <form id="noteForm">

            <input
                type="hidden"
                id="noteCompanyId">


            <div class="form-group">

                <label class="form-label">
                    Note
                </label>

                <textarea
                    class="form-textarea"
                    id="noteText"
                    placeholder="What did HR say? Salary? Next round? Follow-up date?">
                </textarea>

            </div>


            <button
                class="save-btn"
                type="submit">

                💾 Save Note

            </button>

        </form>

    </div>

</div>

========================================================= */

JSON.parse(
    localStorage.getItem("hill2Jobs")

    JSON.stringify(defaultCompanies)

========================================================= */

function save(){

localStorage.setItem(
    "hill2Jobs",
    JSON.stringify(companies)
);

}


/* =========================================================
   SAFE TEXT
========================================================= */

function safe(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

document.getElementById("totalCount").textContent =
companies.length;

document.getElementById("visitedCount").textContent =
companies.filter(c=>c.visited).length;

document.getElementById("contactCount").textContent =
companies.filter(c=>c.contactName || c.phone).length;

document.getElementById("driveCount").textContent =
companies.filter(c=>c.driveDate).length;

}


/* =========================================================
   STATUS BADGE
========================================================= */

function statusBadge(status){

if(status==="Hiring"){
return `<span class="badge badge-hiring">🟢 HIRING</span>`;
}

if(status==="Interview"){
return `<span class="badge badge-interview">🔵 INTERVIEW</span>`;
}

if(status==="Future Opening"){
return `<span class="badge badge-future">🟡 FUTURE</span>`;
}

if(status==="No Opening"){
return `<span class="badge badge-none">🔴 NO OPENING</span>`;
}

return `<span class="badge badge-unknown">STATUS UNKNOWN</span>`;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

const list =
document.getElementById("companyList");

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();


let filtered =
companies.filter(c=>{

let text = `

${c.name}
${c.location}
${c.role}
${c.contactName}
${c.phone}
${c.notes}

`.toLowerCase();

let searchMatch =
text.includes(search);

let filterMatch=true;

if(currentFilter==="visited"){
filterMatch=c.visited;
}

if(currentFilter==="remaining"){
filterMatch=!c.visited;
}

if(currentFilter==="drives"){
filterMatch=!!c.driveDate;
}

return searchMatch && filterMatch;

});


if(filtered.length===0){

list.innerHTML=`

<div class="empty">

<div style="font-size:35px">
🔍
</div>

<h3 style="margin-top:8px">
No companies found
</h3>

<p style="margin-top:6px">
Try another search or add a company.
</p>

</div>

`;

updateDashboard();

return;

}


list.innerHTML =
filtered.map((c,index)=>{

let contactHTML="";

if(c.contactName || c.phone){

contactHTML=`

<div class="quick-info">

${c.contactName ?
`
<div class="info-chip">
👤 ${safe(c.contactName)}
</div>
`
:""}

${c.phone ?
`
<div class="info-chip">
📱 ${safe(c.phone)}
</div>
`
:""}

</div>

`;

}


let driveHTML="";

if(c.driveDate){

let date =
new Date(
    c.driveDate+"T00:00:00"
);

driveHTML=`

<div class="drive-box">

<div class="drive-title">
📅 WALK-IN / DRIVE
</div>

<div class="drive-date">

${date.toLocaleDateString("en-IN")}

${c.driveTime ?
" • "+safe(c.driveTime)
:""}

</div>

${c.driveRole ?
`
<div class="drive-details">
💼 ${safe(c.driveRole)}
</div>
`
:""}

${c.driveDetails ?
`
<div class="drive-details">
${safe(c.driveDetails)}
</div>
`
:""}

</div>

`;

}


let noteHTML="";

if(c.notes){

noteHTML=`

<div class="note-box">

<div class="note-title">
📝 NOTE
</div>

${safe(c.notes)}

</div>

`;

}


return `

<article class="company-card
${c.visited ? "visited":""}
${c.status==="Hiring" ? "hiring":""}">


<div class="company-top">

<div>

<div class="company-number">
STOP ${String(c.id).padStart(2,"0")}
</div>

<div class="company-name">
${safe(c.name)}
</div>

<div class="company-location">
📍 ${safe(c.location || "Location not added")}
</div>

</div>

</div>


<div class="badges">

${statusBadge(c.status)}

${c.visited ?
`
<span class="badge badge-visited">
✓ VISITED
</span>
`
:""}

${c.driveDate ?
`
<span class="badge badge-drive">
📅 DRIVE
</span>
`
:""}

</div>


${c.role ?
`
<div class="role">
💼 ${safe(c.role)}
</div>
`
:""}


${contactHTML}


${driveHTML}


${noteHTML}


<!-- QUICK ACTIONS -->

<div class="quick-actions">


${c.phone ?
`
<a
class="quick-btn btn-call"
href="tel:${safe(c.phone)}">
📞 Call
</a>
`
:
`
<button
class="quick-btn btn-action"
onclick="openContactModal(${c.id})">
👤 + Contact
</button>
`
}


<button
class="quick-btn btn-map"
onclick="openMaps(${c.id})">
📍 Maps
</button>


<a
class="quick-btn btn-linkedin"
target="_blank"
href="${
c.linkedin ||
'https://www.linkedin.com/search/results/companies/?keywords='+
encodeURIComponent(c.name)
}">
🔗 LinkedIn
</a>


<button
class="quick-btn btn-action"
onclick="openContactModal(${c.id})">
${c.contactName || c.phone ?
"✏️ Contact"
:"+ Contact"}
</button>


<button
class="quick-btn btn-action"
onclick="openDriveModal(${c.id})">
${c.driveDate ?
"✏️ Drive"
:"+ Drive"}
</button>


<button
class="quick-btn btn-action"
onclick="openNoteModal(${c.id})">
${c.notes ?
"✏️ Note"
:"+ Note"}
</button>


<button
class="quick-btn btn-action"
onclick="editCompany(${c.id})">
✏️ Edit
</button>


</div>


<button
class="visit-btn"
onclick="toggleVisited(${c.id})">

${c.visited ?
"✓ VISITED — TAP TO UNDO"
:
"✓ MARK AS VISITED"}

</button>


</article>

`;

}).join("");


updateDashboard();

}

========================================================= */

function setFilter(type,button){

document
.querySelectorAll(".filter")
.forEach(b=>{

render();

}

/* =========================================================
   MAPS
========================================================= */

function openMaps(id){

const c =
companies.find(x=>x.id===id);

const query =
encodeURIComponent(
`${c.name}, ${c.location}, Rushikonda, Visakhapatnam`
);

window.open(
`https://www.google.com/maps/search/?api=1&query=${query}`,
"_blank"
);

}

========================================================= */

function toggleVisited(id){

const c =
companies.find(x=>x.id===id);

if(!c)return;

c.visited=!c.visited;

save();

render();

}


/* =========================================================
   MODAL FUNCTIONS
========================================================= */

function openModal(id){

document
.getElementById(id)
.classList.add("show");

}

function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}


/* =========================================================
   COMPANY MODAL
========================================================= */

function openCompanyModal(id=null){

const form =
document.getElementById("companyForm");

form.reset();

document.getElementById("companyId").value="";

document.getElementById("companyModalTitle")
.textContent =
id ? "Edit Company" : "Add Company";


if(id){

const c =
companies.find(x=>x.id===id);

if(!c)return;

document.getElementById("companyId").value=c.id;

document.getElementById("companyName").value=c.name;

document.getElementById("companyLocation").value=c.location;

document.getElementById("companyRole").value=c.role;

document.getElementById("companyStatus").value=c.status;

document.getElementById("companyLinkedin").value=c.linkedin;

}

openModal("companyModal");

}


/* =========================================================
   SAVE COMPANY
========================================================= */

document
.getElementById("companyForm")
.addEventListener("submit",function(e){

e.preventDefault();

const id =
document.getElementById("companyId").value;


if(id){

const c =
companies.find(
x=>x.id===Number(id)
);

c.name =
document.getElementById("companyName").value;

c.location =
document.getElementById("companyLocation").value;

c.role =
document.getElementById("companyRole").value;

c.status =
document.getElementById("companyStatus").value;

c.linkedin =
document.getElementById("companyLinkedin").value;

}else{

companies.push({

id:Date.now(),

name:
document.getElementById("companyName").value,

location:
document.getElementById("companyLocation").value,

role:
document.getElementById("companyRole").value,

status:
document.getElementById("companyStatus").value,

linkedin:
document.getElementById("companyLinkedin").value,

contactName:"",
phone:"",
phone2:"",
driveDate:"",
driveTime:"",
driveRole:"",
driveDetails:"",
notes:"",
visited:false

});

}

save();

closeModal("companyModal");

render();

});

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

const data =
JSON.stringify(
companies,
null,
2
);

const blob =
new Blob(
[data],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=
"hill2-job-tracker-backup.json";

a.click();

URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

function importData(event){

const file =
event.target.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload=function(e){

try{

const imported =
JSON.parse(e.target.result);

if(!Array.isArray(imported))
throw new Error();

companies=imported;

save();

render();

alert(
"Backup restored successfully."
);

}catch(error){

alert(
"Invalid backup file."
);

}

};

reader.readAsText(file);

}


/* =========================================================

========================================================= */

.querySelectorAll(".modal")
.forEach(modal=>{

modal.addEventListener(
"click",
function(e){

if(e.target===modal){

modal.classList.remove("show");

}

});

});
