<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Vizag IT Job Walk Tracker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#eef2f7;
    --card:#fff;
    --text:#07111f;
    --muted:#475569;
    --border:#cbd5e1;

    --dark:#07111f;
    --blue:#075985;
    --bluebg:#e0f2fe;

    --green:#166534;
    --greenbg:#dcfce7;

    --orange:#9a3412;
    --orangebg:#ffedd5;

    --yellow:#854d0e;
    --yellowbg:#fef3c7;

    --red:#991b1b;
    --redbg:#fee2e2;
}

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --muted:#cbd5e1;
    --border:#334155;

    --dark:#f8fafc;

    --blue:#38bdf8;
    --bluebg:#082f49;

    --green:#4ade80;
    --greenbg:#052e16;

    --orange:#fb923c;
    --orangebg:#431407;

    --yellow:#fde047;
    --yellowbg:#422006;

    --red:#f87171;
    --redbg:#450a0a;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:80px;
}

button,input,select,textarea{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#07111f;
    color:#fff;
    padding:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.25);
}

.header-row{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header h1{
    font-size:20px;
}

.header p{
    margin-top:4px;
    color:#cbd5e1;
    font-size:11px;
}

.theme-btn{
    width:44px;
    height:44px;
    border-radius:12px;
    border:2px solid #64748b;
    background:#1e293b;
    color:white;
    font-size:19px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:13px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:12px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:13px;
    padding:10px 4px;
    text-align:center;
}

.stat-number{
    font-size:20px;
    font-weight:900;
}

.stat-label{
    font-size:9px;
    color:var(--muted);
    margin-top:2px;
}

/* SEARCH */

.search-row{
    display:flex;
    gap:7px;
    margin-bottom:9px;
}

.search{
    flex:1;
    min-width:0;
    padding:13px;
    border:2px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:var(--text);
    font-size:14px;
}

.clear{
    width:45px;
    border:2px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:var(--text);
    font-size:18px;
}

/* LOCATION FILTER */

.locations{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:9px;
}

.location-btn{
    white-space:nowrap;
    padding:9px 12px;
    border:2px solid var(--border);
    border-radius:20px;
    background:var(--card);
    color:var(--text);
    font-size:11px;
    font-weight:900;
}

.location-btn.active{
    background:var(--dark);
    color:var(--card);
    border-color:var(--dark);
}

/* STATUS FILTER */

.filters{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:11px;
}

.filter{
    white-space:nowrap;
    padding:8px 11px;
    border:2px solid var(--border);
    border-radius:20px;
    background:var(--card);
    color:var(--text);
    font-size:11px;
    font-weight:800;
}

.filter.active{
    background:#2563eb;
    border-color:#2563eb;
    color:white;
}

/* ADD */

.add-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:14px;
    font-weight:900;
    margin-bottom:13px;
}

/* CARDS */

.company-list{
    display:grid;
    gap:11px;
}

.company{
    background:var(--card);
    border:2px solid var(--border);
    border-left:7px solid #64748b;
    border-radius:15px;
    padding:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.company.current{
    border:3px solid var(--green);
    border-left:9px solid var(--green);
    box-shadow:
        0 0 0 2px rgba(34,197,94,.10),
        0 5px 15px rgba(22,101,52,.15);
}

.company.recent{
    border-left-color:#f59e0b;
}

.company.visited{
    opacity:.82;
}

.current-banner{
    background:var(--green);
    color:white;
    padding:7px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
    margin-bottom:10px;
}

.recent-banner{
    background:var(--yellowbg);
    color:var(--yellow);
    padding:7px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:900;
    margin-bottom:10px;
}

.company-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.stop{
    font-size:10px;
    color:var(--muted);
    font-weight:900;
}

.name{
    font-size:18px;
    font-weight:900;
    margin-top:2px;
    line-height:1.25;
}

.location{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:8px;
}

.badge{
    padding:5px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:900;
}

.b-green{
    background:var(--greenbg);
    color:var(--green);
}

.b-blue{
    background:var(--bluebg);
    color:var(--blue);
}

.b-yellow{
    background:var(--yellowbg);
    color:var(--yellow);
}

.b-grey{
    background:#e2e8f0;
    color:#334155;
}

body.dark .b-grey{
    background:#334155;
    color:#f8fafc;
}

.role{
    background:var(--bg);
    padding:9px;
    border-radius:9px;
    margin-top:8px;
    font-size:11px;
    font-weight:800;
}

/* CONTACT */

.contact{
    margin-top:9px;
    padding:9px;
    border-radius:9px;
    background:var(--bluebg);
    color:var(--text);
    font-size:11px;
    line-height:1.5;
}

/* DRIVE */

.drive{
    margin-top:9px;
    padding:10px;
    border-radius:10px;
    background:var(--bluebg);
    border:1px solid var(--blue);
    font-size:11px;
}

.drive strong{
    color:var(--blue);
}

/* NOTE */

.note{
    margin-top:9px;
    padding:10px;
    border-radius:10px;
    background:var(--yellowbg);
    color:var(--text);
    font-size:11px;
    line-height:1.5;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:11px;
}

.action{
    min-height:42px;
    border:2px solid var(--border);
    border-radius:9px;
    background:var(--card);
    color:var(--text);
    font-size:10px;
    font-weight:900;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.call{
    background:var(--greenbg);
    color:var(--green);
    border-color:var(--green);
}

.maps{
    background:var(--yellowbg);
    color:var(--yellow);
    border-color:var(--yellow);
}

.linkedin{
    background:var(--bluebg);
    color:var(--blue);
    border-color:var(--blue);
}

.visit{
    width:100%;
    min-height:44px;
    margin-top:7px;
    border:2px solid var(--dark);
    background:var(--dark);
    color:var(--card);
    border-radius:9px;
    font-weight:900;
    font-size:12px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.75);
    padding:12px;
    overflow:auto;
}

.modal.show{
    display:block;
}

.modal-box{
    max-width:550px;
    margin:10px auto;
    background:var(--card);
    color:var(--text);
    border-radius:17px;
    padding:17px;
    border:2px solid var(--border);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.modal-title{
    font-size:19px;
    font-weight:900;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:var(--bg);
    color:var(--text);
    font-size:22px;
}

.group{
    margin-bottom:11px;
}

label{
    display:block;
    font-size:11px;
    font-weight:900;
    color:var(--muted);
    margin-bottom:4px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:2px solid var(--border);
    border-radius:9px;
    background:var(--card);
    color:var(--text);
    font-size:14px;
}

textarea{
    min-height:85px;
}

.save{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:900;
}

/* BACKUP */

.backup{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:15px;
}

.backup button{
    padding:12px;
    border:2px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:10px;
    font-weight:900;
}

/* EMPTY */

.empty{
    padding:35px 15px;
    text-align:center;
    background:var(--card);
    border:2px dashed var(--border);
    border-radius:15px;
    color:var(--muted);
}

@media(min-width:700px){
    .company-list{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:380px){
    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<header class="header">
<div class="header-row">

<div>
<h1>🚶 Vizag IT Job Walk</h1>
<p>Hill 1 • Hill 2 • Hill 3 • IT SEZ</p>
</div>

<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
☀️
</button>

</div>
</header>


<main class="container">

<div class="dashboard">

<div class="stat">
<div>🏢</div>
<div class="stat-number" id="total">0</div>
<div class="stat-label">Companies</div>
</div>

<div class="stat">
<div>🟢</div>
<div class="stat-number" id="current">0</div>
<div class="stat-label">Freshers</div>
</div>

<div class="stat">
<div>✅</div>
<div class="stat-number" id="visited">0</div>
<div class="stat-label">Visited</div>
</div>

<div class="stat">
<div>📅</div>
<div class="stat-number" id="drives">0</div>
<div class="stat-label">Drives</div>
</div>

</div>


<div class="search-row">

<input
class="search"
id="search"
placeholder="🔎 Company / role / HR / phone..."
oninput="render()">

<button
class="clear"
onclick="document.getElementById('search').value='';render()">
×
</button>

</div>


<div class="locations">

<button class="location-btn active"
onclick="setLocation('ALL',this)">
ALL
</button>

<button class="location-btn"
onclick="setLocation('Hill 1',this)">
Hill 1
</button>

<button class="location-btn"
onclick="setLocation('Hill 2',this)">
Hill 2
</button>

<button class="location-btn"
onclick="setLocation('Hill 3',this)">
Hill 3
</button>

<button class="location-btn"
onclick="setLocation('IT SEZ',this)">
IT SEZ
</button>

</div>


<div class="filters">

<button class="filter active"
onclick="setStatus('ALL',this)">
All
</button>

<button class="filter"
onclick="setStatus('CURRENT',this)">
🟢 Freshers
</button>

<button class="filter"
onclick="setStatus('RECENT',this)">
🟡 Verify
</button>

<button class="filter"
onclick="setStatus('REMAINING',this)">
Not Visited
</button>

<button class="filter"
onclick="setStatus('VISITED',this)">
Visited
</button>

<button class="filter"
onclick="setStatus('DRIVE',this)">
📅 Drives
</button>

</div>


<button class="add-btn" onclick="openCompany()">
➕ Add Company
</button>


<div id="list" class="company-list"></div>


<div class="backup">

<button onclick="exportData()">
📤 Backup
</button>

<button onclick="document.getElementById('file').click()">
📥 Restore
</button>

</div>

<input
type="file"
id="file"
accept=".json"
style="display:none"
onchange="importData(event)">

</main>


<!-- COMPANY MODAL -->

<div class="modal" id="companyModal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title">
🏢 Company
</div>

<button class="close"
onclick="closeModal('companyModal')">
×
</button>

</div>

<form id="companyForm">

<input type="hidden" id="companyId">

<div class="group">
<label>Company Name *</label>
<input id="companyName" required>
</div>

<div class="group">
<label>Location</label>
<select id="companyLocation">

<option>Hill 1</option>
<option>Hill 2</option>
<option>Hill 3</option>
<option>IT SEZ</option>

</select>
</div>

<div class="group">
<label>Address / Building</label>
<input id="companyAddress">
</div>

<div class="group">
<label>Role</label>
<input id="companyRole"
placeholder="Python / Django / React / Testing...">
</div>

<div class="group">
<label>Hiring Status</label>
<select id="companyStatus">

<option value="VERIFY">
🟡 Verify at office
</option>

<option value="CURRENT">
🟢 Currently hiring freshers
</option>

<option value="RECENT">
🟡 Recent fresher hiring
</option>

<option value="NO">
🔴 No current opening
</option>

</select>
</div>

<div class="group">
<label>LinkedIn</label>
<input id="companyLinkedin">
</div>

<button class="save">
💾 Save Company
</button>

</form>

</div>
</div>


<!-- CONTACT MODAL -->

<div class="modal" id="contactModal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title">
👤 HR / Recruiter
</div>

<button class="close"
onclick="closeModal('contactModal')">
×
</button>

</div>

<form id="contactForm">

<input type="hidden" id="contactId">

<div class="group">
<label>Name</label>
<input id="personName"
placeholder="HR / Recruiter">
</div>

<div class="group">
<label>Mobile Number</label>
<input id="phone"
type="tel"
placeholder="9876543210">
</div>

<div class="group">
<label>Second Number</label>
<input id="phone2"
type="tel">
</div>

<button class="save">
💾 Save Contact
</button>

</form>

</div>
</div>


<!-- DRIVE MODAL -->

<div class="modal" id="driveModal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title">
📅 Walk-in / Drive
</div>

<button class="close"
onclick="closeModal('driveModal')">
×
</button>

</div>

<form id="driveForm">

<input type="hidden" id="driveId">

<div class="group">
<label>Date *</label>
<input id="driveDate" type="date" required>
</div>

<div class="group">
<label>Time</label>
<input id="driveTime" type="time">
</div>

<div class="group">
<label>Role</label>
<input id="driveRole">
</div>

<div class="group">
<label>Details</label>
<textarea id="driveDetails"
placeholder="Reporting time, documents, rounds, HR instructions..."></textarea>
</div>

<button class="save">
💾 Save Drive
</button>

</form>

</div>
</div>


<!-- NOTE MODAL -->

<div class="modal" id="noteModal">

<div class="modal-box">

<div class="modal-head">

<div class="modal-title">
📝 Interview Note
</div>

<button class="close"
onclick="closeModal('noteModal')">
×
</button>

</div>

<form id="noteForm">

<input type="hidden" id="noteId">

<div class="group">

<label>Notes</label>

<textarea id="noteText"
placeholder="HR response, salary, next round, follow-up date..."></textarea>

</div>

<button class="save">
💾 Save Note
</button>

</form>

</div>
</div>

/* =====================================================
   LOCAL STORAGE
===================================================== */

let saved =
JSON.parse(localStorage.getItem("vizagJobTracker")) || {};

let locationFilter="ALL";
let statusFilter="ALL";


function getData(c){

return saved[c.id] || {
visited:false,
personName:"",
phone:"",
phone2:"",
driveDate:"",
driveTime:"",
driveRole:"",
driveDetails:"",
note:""
};

}


function save(){

localStorage.setItem(
"vizagJobTracker",
JSON.stringify(saved)
);

}


/* =====================================================
   RENDER
===================================================== */

function render(){

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


const result =
companies.filter(c=>{

const d=getData(c);

const text=(
c.name+" "+
c.area+" "+
c.address+" "+
c.role+" "+
d.personName+" "+
d.phone+" "+
d.note
).toLowerCase();


if(search && !text.includes(search))
return false;


if(locationFilter!=="ALL" &&
c.area!==locationFilter)
return false;


if(statusFilter==="CURRENT" &&
c.status!=="CURRENT")
return false;


if(statusFilter==="RECENT" &&
c.status!=="RECENT")
return false;


if(statusFilter==="VISITED" &&
!d.visited)
return false;


if(statusFilter==="REMAINING" &&
d.visited)
return false;


if(statusFilter==="DRIVE" &&
!d.driveDate)
return false;


return true;

});


const list=document.getElementById("list");


if(!result.length){

list.innerHTML=`
<div class="empty">
<div style="font-size:35px">🔎</div>
<h3>No companies found</h3>
<p style="margin-top:6px">
Try another filter.
</p>
</div>
`;

updateStats();
return;

}


list.innerHTML=result.map(c=>{

const d=getData(c);


let banner="";

if(c.status==="CURRENT"){

banner=`
<div class="current-banner">
🟢 CURRENT FRESHER / ENTRY-LEVEL HIRING — VERIFY BEFORE TRAVELLING
</div>
`;

}

else if(c.status==="RECENT"){

banner=`
<div class="recent-banner">
🟡 RECENT FRESHER HIRING — ASK IF ANOTHER DRIVE IS OPEN
</div>
`;

}


let statusBadge="";

if(c.status==="CURRENT"){

statusBadge=`
<span class="badge b-green">
CURRENT FRESHER
</span>
`;

}

else if(c.status==="RECENT"){

statusBadge=`
<span class="badge b-yellow">
RECENT
</span>
`;

}

else{

statusBadge=`
<span class="badge b-grey">
ASK / VERIFY
</span>
`;

}


let contact="";

if(d.personName || d.phone){

contact=`
<div class="contact">

<b>👤 Contact</b><br>

${d.personName ?
"Name: "+escapeHTML(d.personName)+"<br>":
""}

${d.phone ?
"📱 "+escapeHTML(d.phone):
""}

${d.phone2 ?
" • "+escapeHTML(d.phone2):
""}

</div>
`;

}


let drive="";

if(d.driveDate){

drive=`
<div class="drive">

<strong>📅 WALK-IN / DRIVE</strong><br>

<b>${formatDate(d.driveDate)}</b>

${d.driveTime ?
" • "+escapeHTML(d.driveTime):
""}

${d.driveRole ?
"<br>💼 "+escapeHTML(d.driveRole):
""}

${d.driveDetails ?
"<br>"+escapeHTML(d.driveDetails):
""}

</div>
`;

}


let note="";

if(d.note){

note=`
<div class="note">
📝 <b>Note:</b>
${escapeHTML(d.note)}
</div>
`;

}


const linkedin =
c.linkedin ||
"https://www.linkedin.com/search/results/companies/?keywords="+
encodeURIComponent(c.name);


return `

<div class="company
${c.status==="CURRENT"?"current":""}
${c.status==="RECENT"?"recent":""}
${d.visited?"visited":""}">

${banner}

<div class="company-top">

<div>

<div class="stop">
STOP ${String(c.id).padStart(2,"0")}
</div>

<div class="name">
${escapeHTML(c.name)}
</div>

<div class="location">
📍 ${escapeHTML(c.area)}
${c.address ?
" • "+escapeHTML(c.address):
""}
</div>

</div>

</div>


<div class="badges">

${statusBadge}

${d.visited ?
`
<span class="badge b-green">
✓ VISITED
</span>
`
:""}

${d.driveDate ?
`
<span class="badge b-blue">
📅 DRIVE
</span>
`
:""}

</div>


<div class="role">
💼 ${escapeHTML(c.role)}
</div>


${contact}

${drive}

${note}


<div class="actions">

${d.phone ?
`
<a
class="action call"
href="tel:${escapeHTML(d.phone)}">
📞 Call
</a>
`
:
`
<button
class="action"
onclick="openContact(${c.id})">
👤 + Contact
</button>
`
}


<button
class="action maps"
onclick="openMaps(${c.id})">
📍 Maps
</button>


<a
class="action linkedin"
href="${linkedin}"
target="_blank"
rel="noopener">
🔗 LinkedIn
</a>


<button
class="action"
onclick="openContact(${c.id})">
${d.phone?"✏️ Contact":"+ Contact"}
</button>


<button
class="action"
onclick="openDrive(${c.id})">
${d.driveDate?"✏️ Drive":"+ Drive"}
</button>


<button
class="action"
onclick="openNote(${c.id})">
${d.note?"✏️ Note":"+ Note"}
</button>


<button
class="action"
onclick="editCompany(${c.id})">
✏️ Edit
</button>

</div>


<button
class="visit"
onclick="toggleVisited(${c.id})">

${d.visited ?
"✓ VISITED — TAP TO UNDO":
"✓ MARK VISITED"}

</button>

</div>

`;

}).join("");

updateStats();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

document.getElementById("total").textContent=
companies.length;

document.getElementById("current").textContent=
companies.filter(c=>c.status==="CURRENT").length;

document.getElementById("visited").textContent=
companies.filter(c=>getData(c).visited).length;

document.getElementById("drives").textContent=
companies.filter(c=>getData(c).driveDate).length;

}


/* =====================================================
   FILTERS
===================================================== */

function setLocation(value,btn){

locationFilter=value;

document
.querySelectorAll(".location-btn")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

render();

}


function setStatus(value,btn){

statusFilter=value;

document
.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

render();

}


/* =====================================================
   VISITED
===================================================== */

function toggleVisited(id){

if(!saved[id])
saved[id]={};

saved[id].visited=
!getData(
companies.find(c=>c.id===id)
).visited;

save();

render();

}


/* =====================================================

===================================================== */

function openMaps(id){

const c=
companies.find(x=>x.id===id);

const query=
encodeURIComponent(
c.name+" "+c.address+" "+c.area+" Visakhapatnam"
);

window.open(
"https://www.google.com/maps/search/?api=1&query="+query,
"_blank"
);

}


/* =====================================================

===================================================== */

function openCompany(id=null){

document.getElementById("companyForm").reset();

document.getElementById("companyId").value=id||"";

if(id){

const c=
companies.find(x=>x.id===id);

document.getElementById("companyName").value=c.name;
document.getElementById("companyLocation").value=c.area;
document.getElementById("companyAddress").value=c.address;
document.getElementById("companyRole").value=c.role;
document.getElementById("companyStatus").value=c.status;
document.getElementById("companyLinkedin").value=c.linkedin;

}

openModal("companyModal");

}


function editCompany(id){

openCompany(id);

}


document
.getElementById("companyForm")
.addEventListener("submit",function(e){

const id=
document.getElementById("companyId").value;


if(id){

const c=
companies.find(x=>x.id===Number(id));

c.name=
document.getElementById("companyName").value;

c.area=
document.getElementById("companyLocation").value;

c.address=
document.getElementById("companyAddress").value;

c.role=
document.getElementById("companyRole").value;

c.status=
document.getElementById("companyStatus").value;

c.linkedin=
document.getElementById("companyLinkedin").value;

}

else{

const newId=
Math.max(...companies.map(x=>x.id))+1;

companies.push({

id:newId,

name:
document.getElementById("companyName").value,

area:
document.getElementById("companyLocation").value,

address:
document.getElementById("companyAddress").value,

role:
document.getElementById("companyRole").value,

status:
document.getElementById("companyStatus").value,

linkedin:
document.getElementById("companyLinkedin").value

});

}

closeModal("companyModal");

render();

});

/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

document.body.classList.toggle("dark");

const dark=
document.body.classList.contains("dark");

localStorage.setItem(
"vizagTheme",
dark?"dark":"light"
);

document.getElementById("themeBtn")
.textContent=
dark?"🌙":"☀️";

}


if(localStorage.getItem("vizagTheme")==="dark"){

document.body.classList.add("dark");

document.getElementById("themeBtn")
.textContent="🌙";

}


/* =====================================================
   BACKUP
===================================================== */

function exportData(){

const data={
companies,
saved,
exportedAt:new Date().toISOString()
};

const blob=
new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download="vizag-it-job-backup.json";
a.click();

URL.revokeObjectURL(url);

}


function importData(event){

const file=
event.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(e){

try{

const data=
JSON.parse(e.target.result);

if(data.saved){

saved=data.saved;

save();

render();

alert("Backup restored.");

}

}catch(err){

alert("Invalid backup file.");

}

};

reader.readAsText(file);

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatDate(value){

if(!value)return "";

const d=
new Date(value+"T00:00:00");

return d.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}
