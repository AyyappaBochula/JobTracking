<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>Hill 2 Job Tracker</title>

<style>
/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#475569;
    --border:#cbd5e1;

    --primary:#0f172a;
    --primary-text:#ffffff;

    --green:#15803d;
    --green-bg:#dcfce7;

    --blue:#075985;
    --blue-bg:#e0f2fe;

    --orange:#9a3412;
    --orange-bg:#ffedd5;

    --yellow:#854d0e;
    --yellow-bg:#fef9c3;

    --red:#b91c1c;
    --red-bg:#fee2e2;
}

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --muted:#cbd5e1;
    --border:#334155;

    --primary:#f8fafc;
    --primary-text:#0f172a;

    --green:#4ade80;
    --green-bg:#052e16;

    --blue:#38bdf8;
    --blue-bg:#082f49;

    --orange:#fb923c;
    --orange-bg:#431407;

    --yellow:#fde047;
    --yellow-bg:#422006;

    --red:#f87171;
    --red-bg:#450a0a;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:var(--bg);
    color:var(--text);

    padding-bottom:90px;

    transition:
        background .2s,
        color .2s;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    background:#0f172a;
    color:#ffffff;

    padding:
        16px
        max(16px,env(safe-area-inset-right))
        16px
        max(16px,env(safe-area-inset-left));

    position:sticky;
    top:0;

    z-index:100;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header h1{
    font-size:21px;
    line-height:1.2;
}

.header p{
    font-size:12px;
    margin-top:5px;
    color:#cbd5e1;
}

.header-actions{
    display:flex;
    gap:7px;
}

.header-btn{
    border:2px solid #64748b;
    background:#1e293b;
    color:#ffffff;

    width:42px;
    height:42px;

    border-radius:12px;

    font-size:19px;

    cursor:pointer;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:850px;

    margin:auto;

    padding:14px;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:12px;
}

.stat{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:11px 5px;

    text-align:center;

    box-shadow:
        0 2px 7px rgba(0,0,0,.05);
}

.stat-icon{
    font-size:18px;
}

.stat-number{
    font-size:21px;
    font-weight:800;

    margin-top:3px;
}

.stat-label{
    color:var(--muted);

    font-size:10px;

    margin-top:2px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    display:flex;
    gap:7px;

    margin-bottom:10px;
}

.search-input{
    flex:1;

    min-width:0;

    padding:14px;

    background:var(--card);

    color:var(--text);

    border:2px solid var(--border);

    border-radius:12px;

    font-size:15px;

    outline:none;
}

.search-input:focus{
    border-color:#2563eb;
}

.clear-search{
    width:48px;

    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    border-radius:12px;

    font-size:18px;

    cursor:pointer;
}

/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:3px;

    margin-bottom:12px;
}

.filter{
    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    padding:9px 13px;

    border-radius:22px;

    white-space:nowrap;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}

.filter.active{
    background:var(--primary);
    color:var(--primary-text);
    border-color:var(--primary);
}

/* =========================================================
   ADD COMPANY
========================================================= */

.add-company{
    width:100%;

    border:none;

    background:#2563eb;

    color:#ffffff;

    padding:14px;

    border-radius:12px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    margin-bottom:13px;

    box-shadow:
        0 3px 8px rgba(37,99,235,.25);
}

.add-company:active{
    transform:scale(.98);
}

/* =========================================================
   COMPANY CARD
========================================================= */

.company-card{
    background:var(--card);

    border:2px solid var(--border);

    border-left:7px solid #64748b;

    border-radius:15px;

    padding:14px;

    margin-bottom:12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.06);
}

.company-card.visited{
    border-left-color:var(--green);
}

.company-card.hiring{
    border-left-color:#2563eb;
}

.company-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:10px;
}

.company-number{
    color:var(--muted);

    font-size:11px;

    font-weight:800;

    margin-bottom:3px;
}

.company-name{
    font-size:18px;

    font-weight:900;

    line-height:1.25;
}

.company-location{
    color:var(--muted);

    font-size:12px;

    margin-top:5px;

    line-height:1.4;
}

/* =========================================================
   STATUS
========================================================= */

.badges{
    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-top:9px;
}

.badge{
    display:inline-block;

    padding:5px 8px;

    border-radius:20px;

    font-size:10px;

    font-weight:900;
}

.badge-hiring{
    background:var(--green-bg);
    color:var(--green);
}

.badge-interview{
    background:var(--blue-bg);
    color:var(--blue);
}

.badge-future{
    background:var(--yellow-bg);
    color:var(--yellow);
}

.badge-none{
    background:var(--red-bg);
    color:var(--red);
}

.badge-unknown{
    background:#e2e8f0;
    color:#334155;
}

body.dark .badge-unknown{
    background:#334155;
    color:#f8fafc;
}

.badge-visited{
    background:var(--green-bg);
    color:var(--green);
}

.badge-drive{
    background:var(--blue-bg);
    color:var(--blue);
}

/* =========================================================
   ROLE
========================================================= */

.role{
    margin-top:9px;

    padding:9px;

    background:var(--bg);

    border-radius:9px;

    font-size:12px;

    font-weight:700;
}

/* =========================================================
   QUICK INFO
========================================================= */

.quick-info{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:9px;
}

.info-chip{
    background:var(--bg);

    border:1px solid var(--border);

    padding:6px 8px;

    border-radius:8px;

    font-size:11px;

    color:var(--muted);

    font-weight:700;
}

/* =========================================================
   DRIVE BOX
========================================================= */

.drive-box{
    background:var(--blue-bg);

    border:2px solid var(--blue);

    color:var(--text);

    border-radius:11px;

    padding:10px;

    margin-top:10px;
}

.drive-title{
    color:var(--blue);

    font-weight:900;

    font-size:12px;
}

.drive-date{
    font-size:15px;

    font-weight:900;

    margin-top:4px;
}

.drive-details{
    font-size:11px;

    margin-top:4px;

    line-height:1.5;
}

/* =========================================================
   NOTES
========================================================= */

.note-box{
    background:var(--yellow-bg);

    color:var(--text);

    border-radius:10px;

    padding:10px;

    margin-top:10px;

    font-size:11px;

    line-height:1.5;
}

.note-title{
    font-weight:900;

    color:var(--yellow);

    margin-bottom:3px;
}

/* =========================================================
   QUICK BUTTONS
========================================================= */

.quick-actions{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:12px;
}

.quick-btn{
    min-height:42px;

    border:2px solid var(--border);

    background:var(--card);

    color:var(--text);

    border-radius:9px;

    font-size:11px;

    font-weight:900;

    cursor:pointer;

    text-decoration:none;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;
}

.quick-btn:active{
    transform:scale(.97);
}

.btn-call{
    background:var(--green-bg);
    color:var(--green);
    border-color:var(--green);
}

.btn-map{
    background:var(--yellow-bg);
    color:var(--yellow);
    border-color:var(--yellow);
}

.btn-linkedin{
    background:var(--blue-bg);
    color:var(--blue);
    border-color:var(--blue);
}

.btn-action{
    background:var(--bg);
}

/* =========================================================
   VISITED
========================================================= */

.visit-btn{
    width:100%;

    margin-top:8px;

    min-height:44px;

    border:2px solid var(--primary);

    background:var(--primary);

    color:var(--primary-text);

    border-radius:10px;

    font-size:13px;

    font-weight:900;

    cursor:pointer;
}

.company-card.visited .visit-btn{
    background:var(--green);

    border-color:var(--green);

    color:white;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    background:rgba(2,6,23,.75);

    padding:12px;

    overflow-y:auto;
}

.modal.show{
    display:block;
}

.modal-box{
    width:100%;

    max-width:550px;

    margin:10px auto;

    background:var(--card);

    color:var(--text);

    border-radius:18px;

    padding:18px;

    border:2px solid var(--border);
}

    display:flex;

    justify-content:s
